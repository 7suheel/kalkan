[project]
name = "kalkan"
dynamic = ["version"]
description = "AI-assisted triage for incoming security reports"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Kalkan contributors" }]
keywords = ["security", "triage", "vulnerability", "llm", "maintainers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/7suheel/kalkan"
Issues = "https://github.com/7suheel/kalkan/issues"

[project.scripts]
kalkan = "kalkan.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/kalkan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kalkan"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "kalkan/prompts"

[tool.hatch.build.targets.sdist]
include = ["src/kalkan", "prompts", "tests", "README.md", "LICENSE", "CLAUDE.md"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "S",   # bandit (security)
    "SIM", # simplify
    "RUF", # ruff-specific
    "PTH", # use pathlib
]
ignore = [
    "S603", # subprocess without shell: we always pass argument lists
    "S607", # partial executable path: we call `git` from PATH on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"eval/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]
addopts = "-ra"
